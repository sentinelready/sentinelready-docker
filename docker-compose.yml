services:
  ollama:
    image: ollama/ollama:latest
    container_name: sentinelready-ollama
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # One-shot: pulls the model on first run so the README's "just works" claim
  # is actually true, instead of the first alert silently hanging for 2
  # minutes (the resilience call_timeout) and falling back to a raw alert.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: sentinelready-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    # Reported 2026-08-08: this hardcoded `llama3.1`, so changing
    # ai.model in sentinelready.yaml pulled nothing -- the configured model
    # was never fetched, and the first alert hung until the breaker timeout
    # and fell back to a raw alert. Compose cannot read sentinelready.yaml,
    # so the model name comes from the environment here. If you change
    # ai.model, set SENTINEL_MODEL to match (see .env.example).
    entrypoint: ["/bin/sh", "-c", "OLLAMA_HOST=http://ollama:11434 ollama pull ${SENTINEL_MODEL:-mistral:7b-instruct-v0.3-q4_K_M}"]
    restart: "no"

  sentinelready:
    image: ghcr.io/sentinelready/sentinelready-docker:latest
    container_name: sentinelready
    ports:
      - "8000:8000"
    volumes:
      - sentinel_data:/app/scripts/data
      - ./sentinelready.yaml:/app/sentinelready.yaml:ro
    environment:
      - SENTINEL_CONFIG=/app/sentinelready.yaml
      # BYOK keys are never written to sentinelready.yaml -- they come from
      # the environment (.env) so they stay out of the mounted config file.
      # Empty defaults keep compose quiet when they are unset: the default
      # provider is Ollama, which needs no key at all.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SENTINEL_AI_API_KEY=${SENTINEL_AI_API_KEY:-}
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  sentinel_data:
  ollama_models:
